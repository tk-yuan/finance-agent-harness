name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 单元测试
        # 全部测试均为离线用例（模型调用走桩、检索不联网），不需要任何 API key。
        # 这是刻意保证的：CI 一旦依赖外部服务，就没人会去维护它。
        run: python -m pytest tests/ -q

      - name: 装配冒烟
        # 不起服务、不调模型，只验证「所有零件能拼起来、工具接线没断」。
        # 本项目踩过工具名对得上但参数名对不上的坑，这一步就是拦它的。
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from finharness.assemble import build_harness
          b = build_harness()
          print('工具', len(b['registry'].names()), '| 技能', len(b['skills'].skills),
                '| 子 Agent', len(b['runner'].specs), '| MCP', len(b['mcp_tools']))
          "

      - name: 内控审计
        # 13 类违规操作逐条真调一遍，全部必须被拦住。
        # 全离线：不调模型、跑在临时账套副本上，所以可以进 CI。
        run: python scripts/audit_controls.py

      - name: 服务能起、路由齐全
        # 业务接口和运行时接口共用一个 app，装配失败在本地只在点开页面时才暴露，
        # 所以这里显式检查一遍：api_v1 要挂上，审批工具要标记出来。
        #
        # 注意别只遍历 app.routes 取 .path：FastAPI 新版本里 include_router 挂进去的是
        # _IncludedRouter，没有 .path 属性（本地旧版本有，所以本机过、CI 挂）。
        # 这里递归展开，兼容两种形态。
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from finharness.server.app import app

          def collect(routes):
              out = set()
              for r in routes:
                  p = getattr(r, 'path', None)
                  if p:
                      out.add(p)
                  sub = getattr(r, 'routes', None)
                  if sub:
                      out |= collect(sub)
              return out

          paths = collect(app.routes) | set(app.openapi().get('paths', {}))
          for need in ('/api/v1/chat', '/api/v1/audit/team', '/runs/{run_id}/events',
                       '/traces/{trace_id}', '/'):
              assert need in paths, '缺少路由 ' + need
          print('路由', len(paths), '条 | 业务 + 运行时 均已装配')
          "

  docker:
    # README 承诺"克隆下来一键起服务"，那就得有人真的构建并起一次。
    # 本地 Docker Desktop 起不来（secrets engine 的 socket 损坏），
    # 所以这一步交给 CI——runner 自带 Docker，而且每次提交都会真跑。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t finance-agent-harness:ci .

      - name: 镜像里能起服务并响应
        # 不配 API key 也能过：/health 是探针，不碰模型。
        #
        # 失败时把诊断逐行打成 annotation：workflow 日志下载要仓库 admin 权限，
        # 而 annotation 是公开可读的——这是排查时唯一看得见的窗口。
        run: |
          diag() { while IFS= read -r l; do echo "::error::$l"; done; }
          set +e
          echo "--- 主机 8000 端口占用情况 ---"
          ss -ltn 2>/dev/null | grep ':8000' || echo "（8000 空闲）"

          docker run -d --name harness -p 8000:8000 finance-agent-harness:ci 2>/tmp/runerr
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::docker run 失败，退出码 $rc"
            echo "runerr:"; cat /tmp/runerr | diag
            echo "docker ps -a:"; docker ps -a | diag
            exit 1
          fi

          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::容器已启动但 /health 60 秒内没响应"
            echo "docker ps -a:"; docker ps -a | diag
            echo "容器日志（末 40 行）:"; docker logs harness 2>&1 | tail -40 | diag
            exit 1
          fi
          echo "健康检查通过：$(cat /tmp/health.json)"

      - name: 产品界面与接口都在
        # 控制台那页已经并进业务界面了，所以这里查的是：产品界面能开、
        # 工具池接口通、业务接口通。容器里没配 key，所以只碰不调模型的那几个。
        run: |
          diag() { while IFS= read -r l; do echo "::error::$l"; done; }
          curl -sf -o /dev/null http://127.0.0.1:8000/     || { echo "::error::产品界面 / 不可访问"; exit 1; }
          curl -sf http://127.0.0.1:8000/tools > /tmp/tools.json \
            || { echo "::error::工具池接口 /tools 不可用"; exit 1; }
          python -c "
          import json
          d = json.load(open('/tmp/tools.json'))
          names = {t['name'] for t in d['tools']}
          for need in ('run_command', 'ask_user', 'read_image', 'remember', 'post_voucher', 'read_file'):
              assert need in names, '缺少工具 ' + need
          gated = {t['name'] for t in d['tools'] if t['requires_approval']}
          assert {'run_command', 'post_voucher', 'spawn_teammate'} <= gated, gated
          print('工具', d['count'], '个 | 需审批', sorted(gated))
          "
          curl -sf -o /dev/null http://127.0.0.1:8000/api/v1/company \
            || { echo "::error::业务接口 /api/v1/company 不可用"; exit 1; }
          echo "产品界面与接口均可访问"

      - name: 收尾
        if: always()
        run: docker rm -f harness || true
