name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 单元测试
        # 全部测试均为离线用例（模型调用走桩、检索不联网），不需要任何 API key。
        # 这是刻意保证的：CI 一旦依赖外部服务，就没人会去维护它。
        run: python -m pytest tests/ -q

      - name: 装配冒烟
        # 不起服务、不调模型，只验证「所有零件能拼起来、工具接线没断」。
        # 本项目踩过工具名对得上但参数名对不上的坑，这一步就是拦它的。
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from finharness.assemble import build_harness
          b = build_harness()
          print('工具', len(b['registry'].names()), '| 技能', len(b['skills'].skills),
                '| 子 Agent', len(b['runner'].specs), '| MCP', len(b['mcp_tools']))
          "

      - name: 内控审计
        # 13 类违规操作逐条真调一遍，全部必须被拦住。
        # 全离线：不调模型、跑在临时账套副本上，所以可以进 CI。
        run: python scripts/audit_controls.py

      - name: 服务能起、路由齐全
        # 业务接口和运行时接口共用一个 app，装配失败在本地只在点开页面时才暴露，
        # 所以这里显式检查一遍：api_v1 要挂上，审批工具要标记出来。
        #
        # 注意别只遍历 app.routes 取 .path：FastAPI 新版本里 include_router 挂进去的是
        # _IncludedRouter，没有 .path 属性（本地旧版本有，所以本机过、CI 挂）。
        # 这里递归展开，兼容两种形态。
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from finharness.server.app import app

          def collect(routes):
              out = set()
              for r in routes:
                  p = getattr(r, 'path', None)
                  if p:
                      out.add(p)
                  sub = getattr(r, 'routes', None)
                  if sub:
                      out |= collect(sub)
              return out

          paths = collect(app.routes) | set(app.openapi().get('paths', {}))
          for need in ('/api/v1/chat', '/runs/{run_id}/events', '/console', '/'):
              assert need in paths, '缺少路由 ' + need
          print('路由', len(paths), '条 | 业务 + 运行时 均已装配')
          "

  docker:
    # README 承诺"克隆下来一键起服务"，那就得有人真的构建并起一次。
    # 本地 Docker Desktop 起不来（secrets engine 的 socket 损坏），
    # 所以这一步交给 CI——runner 自带 Docker，而且每次提交都会真跑。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t finance-agent-harness:ci .

      - name: 镜像里能起服务并响应
        # 不配 API key 也能过：/health 是探针，不碰模型。
        run: |
          docker run -d --name h -p 8000:8000 finance-agent-harness:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          docker logs h | tail -20
          if [ "$ok" != "1" ]; then
            echo "::error::容器起来了但 /health 一直没响应"
            exit 1
          fi
          echo "健康检查通过："; cat /tmp/health.json

      - name: 两个界面入口都在
        run: |
          curl -sf -o /dev/null http://127.0.0.1:8000/          || { echo "::error::业务界面 404"; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:8000/console    || { echo "::error::控制台 404"; exit 1; }
          echo "业务界面 / 与运行时控制台 /console 均可访问"

      - name: 收尾
        if: always()
        run: docker rm -f h || true
